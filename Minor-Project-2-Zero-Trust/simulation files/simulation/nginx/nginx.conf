worker_processes 1;

events { worker_connections 1024; }

http {
    # In a full production deployment, X-Role would be injected by an auth_request
    # call to Keycloak/oauth2-proxy after validating the user's JWT. For this
    # classroom simulation, the role is passed directly via header so the
    # policy-enforcement logic (the important part) can be tested and screenshotted
    # without standing up a full OIDC proxy.

    map $http_x_role $is_finance {
        default 0;
        "finance"  1;
        "it-admin" 1;
    }
    map $http_x_role $is_hr {
        default 0;
        "hr"       1;
        "it-admin" 1;
    }
    map $http_x_role $is_engineering {
        default 0;
        "engineer" 1;
        "it-admin" 1;
    }

    log_format zt '$time_iso8601 | client=$remote_addr | role="$http_x_role" | '
                  'request="$request" | status=$status';
    access_log /var/log/nginx/access.log zt;

    server {
        listen 80;

        # ---- Policy Enforcement Point: Finance segment ----
        location /finance/ {
            if ($is_finance = 0) {
                return 403 "Access Denied: Zero Trust policy blocked this request (role required: finance)\n";
            }
            proxy_pass http://finance-app:80/;
            proxy_set_header Host $host;
        }

        # ---- Policy Enforcement Point: HR segment ----
        location /hr/ {
            if ($is_hr = 0) {
                return 403 "Access Denied: Zero Trust policy blocked this request (role required: hr)\n";
            }
            proxy_pass http://hr-app:80/;
            proxy_set_header Host $host;
        }

        # ---- Policy Enforcement Point: Engineering segment ----
        location /engineering/ {
            if ($is_engineering = 0) {
                return 403 "Access Denied: Zero Trust policy blocked this request (role required: engineer)\n";
            }
            proxy_pass http://engineering-app:80/;
            proxy_set_header Host $host;
        }

        location / {
            return 200 "Zero Trust Gateway is running.\nTry /finance/, /hr/, or /engineering/ with an X-Role header.\n";
            add_header Content-Type text/plain;
        }
    }
}
